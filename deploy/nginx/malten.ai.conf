# nginx site for malten.ai — terminates TLS and reverse-proxies to the local
# Malten process on 127.0.0.1:8080.
#
# This is the *final* state (HTTP -> HTTPS redirect + HTTPS proxy). The
# certificate paths below are created by certbot; obtain them first — see
# deploy/DEPLOY.md for the exact bootstrap order so nginx doesn't fail to start
# referencing certs that don't exist yet.
#
# Install:
#   sudo cp deploy/nginx/malten.ai.conf /etc/nginx/sites-available/malten.ai
#   sudo ln -sf /etc/nginx/sites-available/malten.ai /etc/nginx/sites-enabled/malten.ai
#   sudo nginx -t && sudo systemctl reload nginx

# Redirect all plain HTTP to HTTPS (and answer ACME renewals over HTTP).
server {
    listen 80;
    listen [::]:80;
    server_name malten.ai www.malten.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name malten.ai www.malten.ai;

    ssl_certificate     /etc/letsencrypt/live/malten.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/malten.ai/privkey.pem;
    # Provided by the certbot nginx plugin; safe to include once certbot has run.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Modest request cap; the chat API bodies are tiny.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM-backed replies can take a while (multi-step tool loops), so give
        # the upstream generous read/send timeouts.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
