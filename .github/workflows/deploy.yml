name: deploy

# Builds the binary in CI, then ships it to the server and restarts the
# systemd service. Runs on every push to main (development happens directly on
# main), and can be triggered manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; queue them instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # build exactly what's on main after the merge

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build (static linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o malten ./cmd/malten

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Pin the host key from a secret if provided, otherwise trust-on-first-use.
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

          SSH="ssh -p $PORT -i ~/.ssh/id_deploy $USER@$HOST"

          # Upload to a temp name, then atomically rename into place (rename gives
          # the new binary a fresh inode, so the running process is untouched and
          # we avoid "Text file busy").
          scp -P "$PORT" -i ~/.ssh/id_deploy malten "$USER@$HOST:/home/malten/malten.new"

          # Waitlist admin token (optional): lets you view /api/interest?token=...
          # Set the ADMIN_TOKEN repo secret to enable it; without it, the list is
          # captured but not viewable over HTTP.
          if [ -n "${ADMIN_TOKEN:-}" ]; then
            printf '%s' "$ADMIN_TOKEN" > admin_token.txt
            scp -P "$PORT" -i ~/.ssh/id_deploy admin_token.txt "$USER@$HOST:/home/malten/admin_token"
            rm -f admin_token.txt
          fi

          $SSH 'bash -se' <<'REMOTE'
          set -euo pipefail
          chmod 0755 /home/malten/malten.new
          mv -f /home/malten/malten.new /home/malten/malten
          # The server is now stateless and never writes a DB. Remove any
          # legacy on-disk database so no old user content lingers.
          rm -f /home/malten/malten.db /home/malten/malten.db-shm /home/malten/malten.db-wal
          sudo /usr/bin/systemctl restart malten
          sleep 1
          if systemctl is-active --quiet malten; then
            echo "malten is active"
          else
            echo "malten failed to start:"
            sudo /usr/bin/systemctl status malten --no-pager -n 40 || true
            exit 1
          fi
          REMOTE
