name: Run tests
on: [push]

jobs:
  test:
    name: Test repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run Go tests
        run: go test -v ./...

      - name: Run tests.sh
        run: bash ./tests.sh

      - name: Verify deployment and redeployment
        run: |
          ./scripts/deploy.sh
          ./scripts/deploy.sh
          systemctl is-enabled malten.service
