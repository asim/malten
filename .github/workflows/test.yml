name: test
on: [pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format Go sources
        run: |
          gofmt -w agent internal/server cmd/malten
          python3 - <<'PY'
          import json, pathlib
          files = list(pathlib.Path('agent').glob('*.go')) + list(pathlib.Path('internal/server').glob('*.go')) + list(pathlib.Path('cmd/malten').glob('*.go'))
          print('MALTEN_FORMAT:' + json.dumps({str(p): p.read_text() for p in files}))
          PY
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/malten
      - run: node tests/streams.cjs
