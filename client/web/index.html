<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-language" content="en">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" type="text/css" href="malten.css?v=streamheader1">
    <link rel="canonical" href="https://malten.me" />
    <link rel="manifest" href="/manifest.webmanifest">
  </head>
  <body onhashchange="loadStream();">
    <div id="side">
    </div>
    <div id="main">
      <header id="head">
        <div class="stream-info">
          <a href="/" aria-label="Malten home"><img src="logo.jpg" alt="" width="20" height="20"></a>
          <a href="/" id="current"></a>
          <span id="present" role="status"></span>
        </div>
        <nav id="nav" aria-label="Stream actions">
          <button id="share" type="button">Share</button>
          <a href="/new">New</a>
          <details id="join">
            <summary>Join</summary>
            <form id="goto" onsubmit="return gotoStream(this);">
              <input id="gstream" name="gstream" aria-label="Stream name" placeholder="Stream name" required>
              <button type="submit">Join</button>
            </form>
          </details>
        </nav>
      </header>
      <div id="think">
        <form action="/commands" method="post" id="form" onsubmit="return submitCommand(this);">
          <textarea id="prompt" name="prompt" rows="1" placeholder="What’s on your mind?" maxlength="1024" aria-label="What’s on your mind?" autocomplete="off"></textarea>
	  <input id="message" name="message" type="hidden">
          <input id="stream" name="stream" type="hidden">
	  <div id="controls">
            <button id="send" type="submit">Send</button>
            <button id="speak" type="button">Talk</button>
	    <span id="words"></span>
            <span id="chars">1024</span>
          </div>
        </form>
      </div>
      <div>
        <ul id="messages"></ul>
      </div>
    </div>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script src="malten.js?v=source1"></script>
    <script type="text/javascript">
	$(document).ready(function() {
            setCurrent();
	    getStreams();
	    loadListeners();
	    loadMessages();
	    observeEvents();
	    pollMessages();
	});
    </script>
  </body>
</html>
