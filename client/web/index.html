<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <title>Public streams | Malten</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/timeline.css">
</head>
<body onhashchange="loadStream();">
  <main>
    <header>
      <a class="brand" href="/">malten</a>
      <div class="header-actions">
        <a href="/new">New</a>
        <a href="/#_" id="share">Share</a>
        <a href="#goto" id="goto-toggle" aria-controls="goto" aria-expanded="false">Go to</a>
        <button id="install" type="button" hidden>Install app</button>
      </div>
    </header>
    <form id="goto" hidden onsubmit="return gotoStream(this);"><label class="sr-only" for="gstream">Stream name</label><input id="gstream" name="gstream" type="text" placeholder="Stream name"><button type="submit">Go</button></form>
    <nav aria-label="Spaces"><a href="/private">For me</a><a class="selected" href="/#_" aria-current="page">Public streams</a></nav>
    <section class="capture" aria-label="Write to a stream">
      <form action="/commands" method="post" id="form" onsubmit="return submitCommand(this);">
        <label class="sr-only" for="prompt">What’s on your mind?</label>
        <textarea autofocus id="prompt" name="prompt" rows="2" placeholder="Speak your mind" maxlength="1024" autocomplete="off"></textarea>
        <input id="message" name="message" type="hidden">
        <input id="stream" name="stream" type="hidden">
        <div class="composer-footer"><span class="hint sr-only"><span id="chars">1024</span> characters left</span><div><button id="send" class="primary" type="submit">Send</button></div></div>
        <span id="words" role="status" aria-live="polite"></span>
      </form>
    </section>
    <p class="boundary">Anonymous and shared. Messages expire; anyone with the link can read and copy them.</p>
    <p id="moderation" class="boundary"></p>
    <section class="history" aria-label="Stream messages">
      <div class="history-heading stream-heading">
        <div><h1><a id="current" href="/#_">Public stream</a></h1><span id="present"></span></div>
      </div>
      <ul id="messages"></ul>
    </section>
  </main>
  <script src="/install.js" defer></script>
  <script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
  <script src="/composer.js"></script>
  <script src="/malten.js?v=0.60.0"></script>
  <script>
    $(document).ready(function() {
      initStreamComposer();
      restoreStreamDraft();
      setCurrent();
      getStreams();
      loadListeners();
      loadMessages();
      observeEvents();
      pollMessages();
    });
  </script>
</body>
</html>
