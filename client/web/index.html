<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-language" content="en">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" type="text/css" href="malten.css?v=moderation1">
    <link rel="stylesheet" href="/replies.css">
    <link rel="canonical" href="https://malten.me" />
    <link rel="manifest" href="/manifest.webmanifest">
  </head>
  <body onhashchange="loadStream();">
    <div id="side">
    </div>
    <div id="main">
      <header id="head">
        <div class="stream-info">
          <a href="/" aria-label="Malten home"><img src="logo.jpg" alt="" width="20" height="20"></a>
          <a href="/" id="current"></a>
          <span id="present" role="status"></span>
        </div>
        <nav id="nav" aria-label="Stream actions">
          <a href="/">Home</a>
          <a href="/new">New</a>
          <button id="open-join" type="button" aria-haspopup="dialog">Join</button>
        </nav>
      </header>
      <dialog id="join" class="stream-dialog" aria-labelledby="join-title">
        <header><h2 id="join-title">Join a stream</h2>
          <button id="close-join" type="button" aria-label="Close">×</button>
        </header>
        <section aria-labelledby="public-streams-title">
          <h3 id="public-streams-title">Public streams</h3>
          <ul id="public-streams"></ul>
          <span id="streams-status" role="status"></span>
        </section>
        <form id="goto" onsubmit="return gotoStream(this);">
          <label for="gstream">Stream name</label>
          <input id="gstream" name="gstream" required autofocus>
          <button type="submit">Join</button>
        </form>
        <p><a href="/session">Book a private reflection</a></p>
      </dialog>
      <dialog id="report" class="stream-dialog" aria-labelledby="report-title">
        <header><h2 id="report-title">Report reflection</h2>
          <button type="button" aria-label="Close">×</button>
        </header>
        <form id="report-form">
          <label for="report-reason">Reason for reporting</label>
          <select id="report-reason" required>
            <option value="">Choose a reason</option>
            <option>Abuse or harassment</option>
            <option>Spam</option>
            <option>Other</option>
          </select>
          <button type="submit">Send to moderator</button>
        </form>
        <p id="report-status" role="status"></p>
      </dialog>
      <dialog id="ask-malten" class="stream-dialog" aria-labelledby="ask-title">
        <header><h2 id="ask-title">Ask Malten</h2>
          <button type="button" class="close-dialog" aria-label="Close">×</button>
        </header>
        <blockquote id="ask-reflection" dir="auto"></blockquote>
        <a id="ask-tafsir" hidden>Read verse commentary on Reminder.dev</a>
        <div id="ask-turns" role="log" aria-label="Answers from Malten"></div>
        <form id="ask-form">
          <label for="ask-question">Your question (optional)</label>
          <textarea id="ask-question" name="question" rows="2" placeholder="What would you like to understand?"></textarea>
          <small>Only you see this exchange in Malten.</small>
          <button type="submit">Explain this</button>
        </form>
        <p id="ask-status" role="status"></p>
      </dialog>
      <div id="think">
        <form action="/messages" method="post" id="form" onsubmit="return postMessage();">
          <div id="reply-draft" class="reply-draft" hidden>
            <div class="reply-preview"></div>
            <button type="button" aria-label="Cancel reply">Cancel</button>
          </div>
          <textarea id="prompt" name="message" rows="1" placeholder="What’s on your mind?" aria-describedby="chars" aria-label="What’s on your mind?" autocomplete="off"></textarea>
          <input id="stream" name="stream" type="hidden">
	  <div id="controls">
            <button id="send" type="submit">Send</button>
            <button id="speak" type="button">Talk</button>
	    <span id="words" role="status"></span>
            <span id="chars" role="status"></span>
          </div>
        </form>
      </div>
      <div>
        <span id="link-status" role="status"></span>
        <ul id="messages"></ul>
      </div>
    </div>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js" integrity="sha384-wLhprpjsmjc/XYIcF+LpMxd8yS1gss6jhevOp6F6zhiIoFK6AmHtm4bGKtehTani" crossorigin="anonymous"></script>
    <script src="/profile-links.js"></script>
    <script src="/replies.js"></script>
    <script src="malten.js?v=moderation1"></script>
    <script type="text/javascript">
	$(document).ready(function() {
            setCurrent();
	    getStreams();
	    loadListeners();
	    loadMessages(true);
	    observeEvents();
	    pollMessages();
	});
    </script>
  </body>
</html>
