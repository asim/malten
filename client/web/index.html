<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <title>~ malten</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/timeline.css">
  <script src="/composer.js" defer></script>
  <script src="/local-store.js" defer></script>
  <script src="/malten.js" defer></script>
  <script src="/install.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="stream-title"><a class="brand" href="/">~ malten</a><a id="current" href="#"></a><span id="present"></span></div>
      <div class="header-actions">
        <a href="/new" id="new">New</a>
        <a href="#" id="share">Share</a>
        <a href="#" id="goto-toggle" aria-controls="goto" aria-expanded="false">Go to</a>
        <details class="menu"><summary aria-label="Open menu">Menu</summary><div class="menu-panel">
          <button id="install" type="button" hidden>Install app</button>
          <button id="export" type="button" hidden>Export streams</button>
          <button id="import" type="button" hidden>Import streams</button>
          <p id="storage-info" hidden>Streams stay on this device. Export a backup before clearing browser data.</p>
        </div></details>
      </div>
    <form id="goto" hidden><label class="sr-only" for="gstream">Stream</label><input id="gstream" list="local-streams" autocomplete="off" placeholder="Stream"><datalist id="local-streams"></datalist><button type="submit">Go</button></form>
    </header>
    <nav aria-label="Spaces"><a id="public-tab" href="/">Public</a><a id="local-tab" href="/private">For you</a></nav>
    <section class="capture" aria-label="Write to a stream">
      <form id="form">
        <label class="sr-only" for="prompt">Message</label>
        <textarea autofocus id="prompt" rows="2" placeholder="Speak your mind" autocomplete="off" disabled></textarea>
        <div class="composer-footer"><div><button id="cancel-edit" type="button" hidden>Cancel</button><button id="send" class="primary" type="submit" disabled>Send</button></div></div>
      </form>
    </section>
    <p id="boundary" class="boundary"></p>
    <p id="words" role="status" aria-live="polite"></p>
    <section class="history" aria-label="Stream messages">
      <ul id="messages"></ul>
    </section>
  </main>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <dialog id="share-dialog"><form method="dialog">
    <h2>Share stream</h2>
    <p>This copies the current stream to an anonymous, ephemeral server stream. Anyone with the link can read it. Your local copy stays on this device.</p>
    <p id="share-error" role="alert"></p>
    <div class="dialog-actions"><button value="cancel">Cancel</button><button id="share-confirm" type="button" class="primary">Share</button></div>
  </form></dialog>
</body>
</html>
