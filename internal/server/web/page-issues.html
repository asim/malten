{{define "head"}}
<style>
  .pagehead h1 { font-size: 20px; margin: 4px 0 4px; }
  .lede { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .issue { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 10px 0; }
  .issue.closed { opacity: 0.6; }
  .issue.closed .title { text-decoration: line-through; }
  .issue .title { font-size: 15px; font-weight: 600; }
  .issue .plan { color: var(--muted); font-size: 14px; margin-top: 6px; line-height: 1.5; }
  .issue .foot { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .issue .spacer { flex: 1; }
  .act { background: none; border: 1px solid var(--border); color: var(--fg); border-radius: 8px;
         padding: 5px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .act:hover { border-color: var(--fg); }
  .section { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; margin: 22px 0 4px; }
  .empty { color: var(--muted); padding: 48px 0; text-align: center; line-height: 1.6; }
  .error { color: var(--muted); padding: 20px 0; }
</style>
{{end}}

{{define "content"}}
<div class="wrap">
  <div class="pagehead"><h1>Issues</h1></div>
  <p class="lede">Things you're working through. Malten logs these as you talk, so they live outside your head and you can come back to them — and they travel with you into every conversation.</p>
  <div id="content"></div>
</div>
{{end}}

{{define "scripts"}}
<script>
  const content = document.getElementById('content');
  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
  function when(iso) { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); }

  function card(it) {
    const closed = it.status === 'closed';
    const label = closed ? 'Reopen' : 'Mark done';
    const next = closed ? 'open' : 'closed';
    return `
      <div class="issue ${closed ? 'closed' : ''}">
        <div class="title">${esc(it.title)}</div>
        ${it.plan ? `<div class="plan">${esc(it.plan)}</div>` : ''}
        <div class="foot">
          <span class="mono">${when(it.created_at)}</span>
          <span class="spacer"></span>
          <button class="act" data-id="${esc(it.id)}" data-next="${next}">${label}</button>
        </div>
      </div>`;
  }

  function render(issues) {
    if (!issues || issues.length === 0) {
      content.innerHTML = '<div class="empty">No issues yet.<br>They appear here when you and Malten decide something is worth coming back to.</div>';
      return;
    }
    const open = issues.filter(i => i.status !== 'closed');
    const done = issues.filter(i => i.status === 'closed');
    let html = open.map(card).join('');
    if (done.length) html += `<div class="section">Done</div>` + done.map(card).join('');
    content.innerHTML = html;
    for (const btn of content.querySelectorAll('.act')) {
      btn.addEventListener('click', () => setStatus(btn.dataset.id, btn.dataset.next));
    }
  }

  async function setStatus(id, status) {
    try {
      await fetch('/api/issues', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, status })
      });
      load();
    } catch (_) { /* leave as-is */ }
  }

  async function load() {
    content.innerHTML = '<div class="error">Loading…</div>';
    try {
      const res = await fetch('/api/issues');
      const data = await res.json();
      if (data.error) { content.innerHTML = `<div class="error">${esc(data.error)}</div>`; return; }
      render(data.issues || []);
    } catch (err) {
      content.innerHTML = `<div class="error">Couldn't load your issues.</div>`;
    }
  }
  load();
</script>
{{end}}
