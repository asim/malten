<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malten — Tickets</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e8ec; --muted: #9aa3b2; --accent: #6ea8fe;
    --err: #e06c75; --warn: #e5c07b; --ok: #98c379;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7; --panel: #ffffff; --panel2: #f0f2f5; --border: #dfe3e8;
      --text: #1b1f27; --muted: #667085; --accent: #2563eb;
      --err: #c0392b; --warn: #b7791f; --ok: #2f855a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); min-height: 100vh; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px 40px; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  header a { color: var(--accent); font-size: 13px; text-decoration: none; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
           padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .summary { color: var(--muted); font-size: 13px; margin: 16px 0 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:hover td { background: var(--panel); }
  td.summary-cell { max-width: 420px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
  .kind-escalation { color: var(--warn); border-color: var(--warn); }
  .kind-ticket { color: var(--accent); border-color: var(--accent); }
  .prio-urgent, .prio-high { color: var(--err); border-color: var(--err); }
  .prio-normal { color: var(--muted); }
  .prio-low { color: var(--muted); }
  .status-open { color: var(--ok); border-color: var(--ok); }
  .status-closed { color: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .error { color: var(--err); padding: 20px 0; }

  /* On phones, stack each row into a labelled card instead of a wide table. */
  @media (max-width: 640px) {
    .wrap { padding: 0 14px 32px; }
    table, tbody, tr, td { display: block; }
    thead { position: absolute; left: -9999px; }   /* visually hide the header row */
    tr { border: 1px solid var(--border); border-radius: 10px; margin: 12px 0; padding: 4px 2px; background: var(--panel); }
    tr:hover td { background: transparent; }
    td { border: none; padding: 7px 12px; display: flex; gap: 10px; align-items: baseline; }
    td::before { content: attr(data-label); color: var(--muted); font-size: 12px; text-transform: uppercase;
                 letter-spacing: 0.03em; flex: 0 0 84px; }
    td.summary-cell { max-width: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Malten</h1>
    <span class="sub">support tickets</span>
    <span class="spacer"></span>
    <button id="refresh">Refresh</button>
    <a href="/">← back</a>
  </header>
  <div class="summary" id="summary"></div>
  <div id="content"></div>
</div>
<script>
  const content = document.getElementById('content');
  const summaryEl = document.getElementById('summary');

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function when(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return esc(iso);
    return d.toLocaleString();
  }

  function render(tickets) {
    if (!tickets || tickets.length === 0) {
      summaryEl.textContent = '';
      content.innerHTML = '<div class="empty">No tickets or escalations yet. They appear here when the agent files a ticket or hands off to a human.</div>';
      return;
    }
    const esc_count = tickets.filter(t => t.kind === 'escalation').length;
    const open = tickets.filter(t => t.status === 'open').length;
    summaryEl.textContent = `${tickets.length} item${tickets.length===1?'':'s'} · ${open} open · ${esc_count} escalation${esc_count===1?'':'s'}`;

    const rows = tickets.map(t => `
      <tr>
        <td class="mono" data-label="ID">${esc(t.id)}</td>
        <td data-label="Kind"><span class="badge kind-${esc(t.kind)}">${esc(t.kind)}</span></td>
        <td class="summary-cell" data-label="Summary">${esc(t.summary)}</td>
        <td data-label="Priority"><span class="badge prio-${esc(t.priority)}">${esc(t.priority)}</span></td>
        <td data-label="Status"><span class="badge status-${esc(t.status)}">${esc(t.status)}</span></td>
        <td class="mono" data-label="Customer">${esc(t.customer_id) || '—'}</td>
        <td class="mono" data-label="Session">${esc(t.session_id) || '—'}</td>
        <td class="mono" data-label="Created">${when(t.created_at)}</td>
      </tr>`).join('');

    content.innerHTML = `
      <table>
        <thead>
          <tr><th>ID</th><th>Kind</th><th>Summary</th><th>Priority</th><th>Status</th><th>Customer</th><th>Session</th><th>Created</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  async function load() {
    content.innerHTML = '<div class="summary">Loading…</div>';
    try {
      const res = await fetch('/api/tickets');
      const data = await res.json();
      if (data.error) { content.innerHTML = `<div class="error">Error: ${esc(data.error)}</div>`; return; }
      render(data.tickets || []);
    } catch (err) {
      content.innerHTML = `<div class="error">Failed to load: ${esc(err.message)}</div>`;
    }
  }

  document.getElementById('refresh').addEventListener('click', load);
  load();
</script>
</body>
</html>
