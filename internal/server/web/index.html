<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malten — Support Agent</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e8ec; --muted: #9aa3b2; --accent: #6ea8fe; --user: #244163;
    --agent: #1e222b; --err: #e06c75; --warn: #e5c07b; --ok: #98c379;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7; --panel: #ffffff; --panel2: #f0f2f5; --border: #dfe3e8;
      --text: #1b1f27; --muted: #667085; --accent: #2563eb; --user: #dbeafe;
      --agent: #f0f2f5; --err: #c0392b; --warn: #b7791f; --ok: #2f855a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; }
  .app { display: flex; flex-direction: column; width: 100%; max-width: 820px; margin: 0 auto; height: 100vh; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  header a { color: var(--accent); font-size: 13px; text-decoration: none; }
  .controls { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  .controls label { font-size: 13px; color: var(--muted); }
  .controls input { background: var(--panel2); border: 1px solid var(--border); color: var(--text);
                    border-radius: 8px; padding: 6px 10px; font-size: 13px; width: 140px; }
  .controls .hint { font-size: 12px; color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; flex-direction: column; max-width: 88%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .user .bubble { background: var(--user); }
  .agent .bubble { background: var(--agent); border: 1px solid var(--border); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 5px; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); }
  .badge.esc { color: var(--warn); border-color: var(--warn); }
  .badge.allow { color: var(--ok); border-color: var(--ok); }
  .badge.deny, .badge.err { color: var(--err); border-color: var(--err); }
  .actions { margin-top: 6px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--border);
             border-radius: 10px; padding: 8px 10px; width: 100%; }
  .actions code { color: var(--text); }
  form { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
  #input { flex: 1; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
           border-radius: 10px; padding: 12px 14px; font-size: 14px; resize: none; font-family: inherit; }
  button { background: var(--accent); color: white; border: 0; border-radius: 10px; padding: 0 18px; font-size: 14px;
           cursor: pointer; font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  .typing { color: var(--muted); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Malten</h1>
    <span class="sub">conversational support agent</span>
    <span class="spacer"></span>
    <a href="/api/tickets" target="_blank">backlog →</a>
  </header>
  <div class="controls">
    <label for="cust">Customer ID</label>
    <input id="cust" placeholder="CUST-1001" autocomplete="off">
    <span class="hint">try CUST-1001 (Ada) or CUST-1002 (Alan)</span>
  </div>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask about billing, refunds, login, or anything else…"></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</div>
<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const cust = document.getElementById('cust');
  const sendBtn = document.getElementById('send');
  let sessionId = localStorage.getItem('malten_session') || '';
  cust.value = localStorage.getItem('malten_customer') || '';

  function el(cls, html) { const d = document.createElement('div'); d.className = cls; if (html !== undefined) d.innerHTML = html; return d; }
  function esc(s) { return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  function addMessage(role, text, reply) {
    const wrap = el('msg ' + role);
    wrap.appendChild(el('bubble', esc(text)));
    if (reply) {
      const meta = el('meta');
      meta.innerHTML = `<span>${reply.steps} step${reply.steps===1?'':'s'}</span>`;
      if (reply.escalated) meta.innerHTML += ` <span class="badge esc">escalated</span>`;
      wrap.appendChild(meta);
      if (reply.actions && reply.actions.length) {
        const a = el('actions');
        a.innerHTML = reply.actions.map(ac => {
          const cls = ac.decision === 'allow' ? 'allow' : (ac.decision === 'escalate' ? 'esc' : 'deny');
          const r = ac.reason ? ` — ${esc(ac.reason)}` : (ac.result ? ` — ${esc(ac.result)}` : '');
          return `<div><code>${esc(ac.tool)}</code> <span class="badge ${cls}">${ac.decision}</span>${r}</div>`;
        }).join('');
        wrap.appendChild(a);
      }
    }
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }

  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    localStorage.setItem('malten_customer', cust.value.trim());
    addMessage('user', text);
    input.value = ''; input.style.height = 'auto';
    sendBtn.disabled = true;
    const typing = el('msg agent'); typing.appendChild(el('typing', 'Malten is thinking…')); log.appendChild(typing); log.scrollTop = log.scrollHeight;
    try {
      const res = await fetch('/api/chat', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ session_id: sessionId, customer_id: cust.value.trim(), message: text })
      });
      const data = await res.json();
      typing.remove();
      if (data.error) { addMessage('agent', 'Error: ' + data.error); }
      else {
        sessionId = data.session_id; localStorage.setItem('malten_session', sessionId);
        addMessage('agent', data.text, data);
      }
    } catch (err) {
      typing.remove();
      addMessage('agent', 'Network error: ' + err.message);
    } finally {
      sendBtn.disabled = false; input.focus();
    }
  });

  input.focus();
</script>
</body>
</html>
