<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover{{if .ChatViewport}}, interactive-widget=resizes-content{{end}}">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Malten">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
{{block "head" .}}{{end}}
</head>
<body class="{{.BodyClass}}">
  <header class="topbar">
    <div class="bar">
      <a class="brand" href="/">Malten</a>
      <nav>
        <a href="/"{{if eq .Active "chat"}} class="active"{{end}}>Chat</a>
        <a href="/tickets"{{if eq .Active "tickets"}} class="active"{{end}}>Tickets</a>
        <a href="/admin"{{if eq .Active "admin"}} class="active"{{end}}>Admin</a>
        <a href="/status"{{if eq .Active "status"}} class="active"{{end}}>Status</a>
      </nav>
    </div>
  </header>
  {{block "content" .}}{{end}}
  {{block "scripts" .}}{{end}}
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
