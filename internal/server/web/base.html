<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/leaflet.css">
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0c0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Malten">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
{{block "head" .}}{{end}}
</head>
<body>
  {{block "content" .}}{{end}}
  <script src="/leaflet.js"></script>
  <script src="/app.js"></script>
  {{block "scripts" .}}{{end}}
  <script>
    if ('serviceWorker' in navigator) {
      // When a new service worker takes over (after a deploy), reload once so
      // the running page picks up the fresh app instead of staying on the old
      // cached one. The flag guards against reload loops.
      var swRefreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (swRefreshing) return;
        swRefreshing = true;
        window.location.reload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
