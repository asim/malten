{{define "head"}}
<style>
  .banner { border-radius: 14px; padding: 22px 20px; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
  .banner.ok { background: var(--ok-bg); border-color: var(--ok); }
  .banner.bad { background: var(--bad-bg); border-color: var(--bad); }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .banner.ok .dot { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-bg); }
  .banner.bad .dot { background: var(--bad); box-shadow: 0 0 0 4px var(--bad-bg); }
  .banner .headline { font-size: 18px; font-weight: 650; }
  .banner .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .components { margin-top: 16px; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .row .name { flex: 1; font-size: 15px; }
  .row .state { font-size: 13px; font-weight: 600; }
  .row .state.ok { color: var(--ok); }
  .row .state.bad { color: var(--bad); }
  .pill { width: 9px; height: 9px; border-radius: 50%; }
  .pill.ok { background: var(--ok); }
  .pill.bad { background: var(--bad); }
  .foot { margin-top: 14px; font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
</style>
{{end}}

{{define "content"}}
<div class="wrap">
  <div class="status">
    <div class="banner ok" id="banner">
      <span class="dot"></span>
      <div>
        <div class="headline" id="headline">Checking…</div>
        <div class="sub" id="subline">Fetching current status</div>
      </div>
    </div>

    <div class="components">
      <div class="row">
        <span class="pill ok" id="pill-chat"></span>
        <span class="name">Support chat assistant</span>
        <span class="state ok" id="state-chat">—</span>
      </div>
    </div>

    <div class="foot">
      <span id="uptime"></span>
      <span id="checked"></span>
    </div>
  </div>
</div>
{{end}}

{{define "scripts"}}
<script>
  const banner = document.getElementById('banner');
  const headline = document.getElementById('headline');
  const subline = document.getElementById('subline');
  const pillChat = document.getElementById('pill-chat');
  const stateChat = document.getElementById('state-chat');
  const uptimeEl = document.getElementById('uptime');
  const checkedEl = document.getElementById('checked');

  function humanUptime(s) {
    if (s == null) return '';
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    if (d) return `${d}d ${h}h`;
    if (h) return `${h}h ${m}m`;
    return `${m}m`;
  }

  function apply(ok, data) {
    banner.className = 'banner ' + (ok ? 'ok' : 'bad');
    headline.textContent = ok ? 'All systems operational' : 'Service disruption';
    subline.textContent = ok
      ? 'Malten is available and responding normally.'
      : 'We are experiencing an issue and are looking into it.';
    pillChat.className = 'pill ' + (ok ? 'ok' : 'bad');
    stateChat.className = 'state ' + (ok ? 'ok' : 'bad');
    stateChat.textContent = ok ? 'Operational' : 'Degraded';
    uptimeEl.textContent = data && data.uptime_seconds != null ? 'Uptime ' + humanUptime(data.uptime_seconds) : '';
    checkedEl.textContent = 'Checked ' + new Date().toLocaleTimeString();
  }

  async function check() {
    try {
      const res = await fetch('/api/status', { cache: 'no-store' });
      const data = await res.json();
      apply(res.ok && data.status === 'operational', data);
    } catch (err) {
      apply(false, null);
    }
  }

  check();
  setInterval(check, 30000);   // refresh every 30s
</script>
{{end}}
