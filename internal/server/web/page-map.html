{{define "content"}}
<div class="app">
  <div class="topbar">
    <span class="brand">Malten</span>
    <div class="search" id="searchbox" hidden>
      <input id="searchInput" type="search" placeholder="Search Great Britain…" autocomplete="off">
      <div class="results" id="searchResults" hidden></div>
    </div>
    <span class="spacer"></span>
    <span class="count" id="count"></span>
    <button class="keybtn" id="settings">Map key</button>
  </div>
  <div id="map"></div>
  <div class="hint" id="hint">Tap the map to log a find</div>
  <div class="around" id="around" hidden></div>
  <div class="fabs">
    <button class="fab" id="ask" title="Ask Malten" hidden>✦</button>
    <button class="fab" id="rail" title="Live rail (Great Britain)" hidden>🚆</button>
    <button class="fab" id="buses" title="Live buses (Great Britain)" hidden>🚍</button>
    <button class="fab" id="live" title="Bus & tube arrivals (London)">🚌</button>
    <button class="fab" id="locate" title="Find my location">◎</button>
  </div>
  <div class="chat" id="chat" hidden>
    <div class="chat-head"><span class="chat-title">Ask Malten</span><button class="chat-x" id="chatClose" title="Close">✕</button></div>
    <div class="chat-log" id="chatLog"></div>
    <form class="chat-input" id="chatForm">
      <input id="chatText" placeholder="What’s nearby, or how do I get to…?" autocomplete="off">
      <button class="primary" type="submit">Ask</button>
    </form>
  </div>
</div>
{{end}}

{{define "scripts"}}
<script>
  const OS_STYLE = 'Outdoor_3857';
  const app = document.querySelector('.app');
  const countEl = document.getElementById('count');
  const hintEl = document.getElementById('hint');
  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

  // Minimal, dependency-free markdown → HTML for chat replies. Input is escaped
  // first, so the regexes only ever produce our own safe tags.
  function mdInline(s) {
    s = s.replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function mdToHtml(src) {
    const lines = esc(src).split('\n');
    let html = '', list = null;
    const closeList = () => { if (list) { html += '</' + list + '>'; list = null; } };
    for (const line of lines) {
      let m;
      if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
        if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; }
        html += '<li>' + mdInline(m[1]) + '</li>';
      } else if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) {
        if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; }
        html += '<li>' + mdInline(m[1]) + '</li>';
      } else if ((m = line.match(/^\s*#{1,6}\s+(.*)$/))) {
        closeList(); html += '<div class="mdh">' + mdInline(m[1]) + '</div>';
      } else if (line.trim() === '') {
        closeList();
      } else {
        closeList(); html += '<div>' + mdInline(line) + '</div>';
      }
    }
    closeList();
    return html;
  }

  // OS Maps API (EPSG:3857) serves zoom 7–20; starting lower shows only 404s.
  const map = L.map('map', { zoomControl: true, attributionControl: true, minZoom: 7, maxZoom: 20 }).setView([54.5, -2.5], 7);
  map.attributionControl.setPrefix(false);
  // Keep the (required) OS credit clear of the controls and chat on the right.
  map.attributionControl.setPosition('bottomleft');
  // It shows as a compact one-line chip; tap it (not its links) to expand/collapse.
  const attribEl = map.attributionControl.getContainer();
  if (attribEl) attribEl.addEventListener('click', e => { if (e.target.tagName !== 'A') attribEl.classList.toggle('expanded'); });

  const pinIcon = L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [16, 16], iconAnchor: [8, 16] });
  const meIcon = L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [14, 14], iconAnchor: [7, 7] });

  // --- OS map tiles ---------------------------------------------------------
  // If the server has a shared OS key it proxies tiles at /api/tiles and the
  // user never needs one. Otherwise the tiles are fetched straight from the OS
  // with the per-user key entered in this browser (the original model).
  let tiles = null, tileErrored = false, serverTiles = false;
  function setTiles() {
    if (tiles) { map.removeLayer(tiles); tiles = null; }
    tileErrored = false;
    refreshUI();
    let url;
    if (serverTiles) {
      url = '/api/tiles/{z}/{x}/{y}.png';
    } else {
      const key = Malten.getKey();
      if (!key) return;
      url = 'https://api.os.uk/maps/raster/v1/zxy/' + OS_STYLE + '/{z}/{x}/{y}.png?key=' + encodeURIComponent(key);
    }
    tiles = L.tileLayer(url, {
      minZoom: 7, maxZoom: 20,
      attribution: 'Contains OS data &copy; Crown copyright and database rights 2026',
    }).addTo(map);
    tiles.on('tileerror', () => {
      if (!tileErrored) {
        tileErrored = true;
        hintEl.textContent = serverTiles ? 'Map tiles didn’t load' : 'Tiles didn’t load — check the key is right and the OS Maps API is added to your project';
      }
    });
    tiles.on('load', () => { if (tileErrored) { tileErrored = false; refreshUI(); } });
  }

  // Keep the key button and hint reflecting the tile source.
  function refreshUI() {
    const btn = document.getElementById('settings');
    if (serverTiles) {
      btn.hidden = true; // no per-user key needed
      if (!tileErrored) hintEl.textContent = 'Tap the map to log a find';
      return;
    }
    btn.hidden = false;
    const has = !!Malten.getKey();
    btn.textContent = has ? 'Map key' : 'Add map key';
    btn.classList.toggle('accent', !has);
    if (!tileErrored) hintEl.textContent = has ? 'Tap the map to log a find' : 'Add your OS key to load the map';
  }

  // --- a floating card helper -----------------------------------------------
  let sheet = null;
  function closeSheet() { if (sheet) { sheet.remove(); sheet = null; } }
  function openSheet(cls, html) {
    closeSheet();
    sheet = document.createElement('div');
    sheet.className = 'sheet ' + cls;
    sheet.innerHTML = html;
    app.appendChild(sheet);
    return sheet;
  }

  function askForKey() {
    const s = openSheet('keycard',
      '<h2>Add your OS map key</h2>' +
      '<p>Malten draws its maps from Great Britain’s national mapping, the Ordnance Survey. ' +
      'On the <a href="https://osdatahub.os.uk/" target="_blank" rel="noopener">OS Data Hub</a>, add a project with the <b>OS Maps API</b> and paste its <b>Project API Key</b> here. ' +
      'You don’t need the secret. It’s stored only in this browser and sent straight to the OS.</p>' +
      '<input id="key" placeholder="Project API Key (not the secret)" autocomplete="off" value="' + esc(Malten.getKey()) + '">' +
      '<div class="row"><span class="spacer"></span><button class="primary" id="savekey">Save</button></div>');
    const input = s.querySelector('#key');
    input.focus();
    s.querySelector('#savekey').onclick = () => { Malten.setKey(input.value.trim()); closeSheet(); setTiles(); };
  }

  // --- outside GB: invite them to register interest -------------------------
  function openInterest(latlng) {
    const s = openSheet('keycard',
      '<h2>Malten is Great Britain only, for now</h2>' +
      '<p>The maps come from Ordnance Survey, which covers England, Scotland and Wales. ' +
      'Leave your email and we’ll tell you when Malten reaches where you are.</p>' +
      '<input id="email" type="email" placeholder="you@example.com" autocomplete="email">' +
      '<textarea id="where" rows="2" placeholder="Where are you? (optional)" style="margin-top:8px"></textarea>' +
      '<div class="row"><button class="ghost" id="notnow">Not now</button><span class="spacer"></span><button class="primary" id="reg">Register interest</button></div>');
    const email = s.querySelector('#email'); email.focus();
    s.querySelector('#notnow').onclick = closeSheet;
    s.querySelector('#reg').onclick = () => {
      const v = email.value.trim();
      if (v.indexOf('@') < 1) { email.focus(); return; }
      const btn = s.querySelector('#reg'); btn.disabled = true; btn.textContent = 'Sending…';
      fetch('/api/interest', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: v, note: s.querySelector('#where').value.trim(), country: navigator.language || '', lat: latlng.lat, lng: latlng.lng }),
      }).then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(() => {
          localStorage.setItem('malten_interest', 'done');
          openSheet('keycard', '<h2>Thanks — you’re on the list</h2><p>We’ll be in touch when Malten reaches you.</p><div class="row"><span class="spacer"></span><button class="primary" id="ok">Close</button></div>');
          sheet.querySelector('#ok').onclick = closeSheet;
        })
        .catch(() => { btn.disabled = false; btn.textContent = 'Register interest'; });
    };
  }

  // --- logging a find --------------------------------------------------------
  let temp = null;
  function clearTemp() { if (temp) { map.removeLayer(temp); temp = null; } }

  function openLog(latlng) {
    clearTemp();
    temp = L.marker(latlng, { icon: pinIcon }).addTo(map);
    const s = openSheet('logsheet',
      '<div class="gridref" id="gr">…</div><div class="sub" id="grsub">fetching grid reference…</div>' +
      '<textarea id="note" rows="2" placeholder="What’s here? (optional)"></textarea>' +
      '<div class="row"><button class="ghost" id="cancel">Cancel</button><span class="spacer"></span><button class="primary" id="save">Save find</button></div>');
    let ref = { grid_ref: null };
    fetch('/api/gridref?lat=' + latlng.lat + '&lng=' + latlng.lng)
      .then(r => r.json())
      .then(d => {
        ref = d;
        s.querySelector('#gr').textContent = d.in_gb ? d.grid_ref : 'Outside Great Britain';
        s.querySelector('#grsub').textContent = d.in_gb
          ? 'OS National Grid · ' + latlng.lat.toFixed(5) + ', ' + latlng.lng.toFixed(5)
          : 'The OS National Grid only covers England, Scotland and Wales.';
      })
      .catch(() => { s.querySelector('#grsub').textContent = 'couldn’t reach the grid service'; });
    s.querySelector('#cancel').onclick = () => { clearTemp(); closeSheet(); };
    s.querySelector('#save').onclick = () => {
      const find = {
        id: Malten.newId(), lat: latlng.lat, lng: latlng.lng,
        note: s.querySelector('#note').value.trim(),
        grid_ref: ref.in_gb ? ref.grid_ref : null,
        created_at: new Date().toISOString(),
      };
      Malten.addFind(find);
      clearTemp(); closeSheet();
      addFindMarker(find);
      updateCount();
    };
  }

  function popupHtml(f) {
    return '<div class="note">' + (f.note ? esc(f.note) : '<span class="sub">No note</span>') + '</div>' +
      '<div class="sub gridref">' + esc(f.grid_ref || 'Outside GB') + '</div>' +
      '<div class="row"><span class="spacer"></span><button class="ghost del">Delete</button></div>';
  }
  function addFindMarker(f) {
    const m = L.marker([f.lat, f.lng], { icon: pinIcon }).addTo(map).bindPopup(popupHtml(f));
    m.on('popupopen', e => {
      const btn = e.popup.getElement().querySelector('.del');
      if (btn) btn.onclick = () => { Malten.removeFind(f.id); map.removeLayer(m); updateCount(); };
    });
    return m;
  }

  function updateCount() {
    const n = Malten.getFinds().length;
    countEl.textContent = n ? n + ' find' + (n === 1 ? '' : 's') : '';
  }

  // --- location --------------------------------------------------------------
  let meMarker = null, meCircle = null;
  document.getElementById('locate').onclick = () => { hintEl.textContent = 'Finding your location…'; map.locate({ enableHighAccuracy: true, timeout: 10000 }); };
  map.on('locationfound', e => {
    myLoc = e.latlng;
    if (meMarker) map.removeLayer(meMarker);
    if (meCircle) map.removeLayer(meCircle);
    meMarker = L.marker(e.latlng, { icon: meIcon }).addTo(map);
    meCircle = L.circle(e.latlng, { radius: e.accuracy, color: '#2b7fff', weight: 1, fillOpacity: 0.08 }).addTo(map);
    // Only recentre if you're within OS coverage (Great Britain). Otherwise the
    // basemap would go blank — OS maps don't cover NI, Ireland or abroad.
    fetch('/api/gridref?lat=' + e.latlng.lat + '&lng=' + e.latlng.lng)
      .then(r => r.json())
      .then(d => {
        if (d.in_gb) { map.setView(e.latlng, Math.max(16, map.getZoom())); hintEl.textContent = 'Tap the map to log a find'; goLive(e.latlng); }
        else {
          hintEl.textContent = 'You’re outside OS coverage — Great Britain only';
          if (localStorage.getItem('malten_interest') !== 'done') openInterest(e.latlng);
        }
      })
      .catch(() => { map.setView(e.latlng, Math.max(16, map.getZoom())); });
  });
  map.on('locationerror', () => { hintEl.textContent = 'Location unavailable — tap the map to log a find'; });

  // --- live transport overlay (TfL: London) ---------------------------------
  const stopLayer = L.layerGroup().addTo(map);
  const stopIcon = L.divIcon({ className: '', html: '<div class="stop"></div>', iconSize: [12, 12], iconAnchor: [6, 6] });
  let live = false, loadTimer = null;
  const liveBtn = document.getElementById('live');
  liveBtn.onclick = () => {
    live = !live; liveBtn.classList.toggle('accent', live);
    if (live) loadStops(); else { stopLayer.clearLayers(); refreshUI(); }
  };
  map.on('moveend', () => { if (live) { clearTimeout(loadTimer); loadTimer = setTimeout(loadStops, 400); } });

  async function loadStops() {
    if (!live) return;
    if (map.getZoom() < 14) { stopLayer.clearLayers(); hintEl.textContent = 'Zoom in to see live stops'; return; }
    const c = map.getCenter();
    try {
      const res = await fetch('/api/stops?lat=' + c.lat + '&lng=' + c.lng + '&radius=500');
      const d = await res.json();
      stopLayer.clearLayers();
      const stops = d.stops || [];
      if (!stops.length) { hintEl.textContent = 'No live transport here — London only, for now'; return; }
      hintEl.textContent = stops.length + ' stops nearby — tap one for live times';
      stops.forEach(addStop);
    } catch (_) { hintEl.textContent = 'Couldn’t load live transport'; }
  }

  function addStop(s) {
    const m = L.marker([s.lat, s.lon], { icon: stopIcon }).addTo(stopLayer);
    m.bindPopup('<div class="stopname">' + esc(s.name) + '</div>' +
      '<div class="sub">' + esc(s.lines.join(' · ')) + '</div>' +
      '<div class="sub" id="arr-' + esc(s.id) + '">…</div>', { minWidth: 210 });
    m.on('popupopen', async () => {
      const box = document.getElementById('arr-' + s.id);
      if (!box) return;
      box.textContent = 'loading live times…';
      try {
        const res = await fetch('/api/arrivals?id=' + encodeURIComponent(s.id));
        const a = (await res.json()).arrivals || [];
        box.innerHTML = a.length
          ? a.map(x => '<div class="arr"><b>' + esc(x.line) + '</b> ' + esc(x.destination) + ' · ' + x.mins + ' min</div>').join('')
          : 'no arrivals due right now';
      } catch (_) { box.textContent = 'couldn’t load live times'; }
    });
  }

  // --- place search (OS Names gazetteer) ------------------------------------
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');
  const searchBox = document.getElementById('searchbox');
  let searchTimer = null, searchMarker = null;

  function placeSub(p) {
    return [p.type, p.county].filter(Boolean).join(' · ') + (p.grid_ref ? (p.type || p.county ? ' · ' : '') + p.grid_ref : '');
  }
  function renderResults(list) {
    if (!list.length) { searchResults.hidden = true; searchResults.innerHTML = ''; return; }
    searchResults.innerHTML = list.map((p, i) =>
      '<div class="r" data-i="' + i + '"><div class="n">' + esc(p.name) + '</div><div class="t">' + esc(placeSub(p)) + '</div></div>').join('');
    searchResults.hidden = false;
    Array.from(searchResults.querySelectorAll('.r')).forEach(el => { el.onclick = () => selectPlace(list[+el.dataset.i]); });
  }
  function selectPlace(p) {
    searchResults.hidden = true;
    searchInput.value = p.name;
    const ll = L.latLng(p.lat, p.lng);
    map.setView(ll, Math.max(15, map.getZoom()));
    if (searchMarker) map.removeLayer(searchMarker);
    searchMarker = L.marker(ll, { icon: pinIcon }).addTo(map).bindPopup(
      '<div class="stopname">' + esc(p.name) + '</div><div class="sub">' + esc(placeSub(p)) + '</div>' +
      '<div class="row"><span class="spacer"></span><button class="ghost" id="logHere">Log a find here</button></div>').openPopup();
    searchMarker.on('popupopen', e => {
      const b = e.popup.getElement().querySelector('#logHere');
      if (b) b.onclick = () => { if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; } openLog(ll); };
    });
  }
  searchInput.oninput = () => {
    const q = searchInput.value.trim();
    clearTimeout(searchTimer);
    if (q.length < 2) { searchResults.hidden = true; return; }
    searchTimer = setTimeout(async () => {
      try {
        const res = await fetch('/api/search?q=' + encodeURIComponent(q));
        renderResults((await res.json()).results || []);
      } catch (_) { searchResults.hidden = true; }
    }, 300);
  };
  searchInput.onkeydown = e => { if (e.key === 'Escape') { searchResults.hidden = true; searchInput.blur(); } };
  document.addEventListener('click', e => { if (!searchBox.contains(e.target)) searchResults.hidden = true; });

  // --- live rail overlay (National Rail: Great Britain) ---------------------
  const railLayer = L.layerGroup().addTo(map);
  const railIcon = L.divIcon({ className: '', html: '<div class="station"></div>', iconSize: [14, 14], iconAnchor: [7, 7] });
  let rail = false, railTimer = null;
  const railBtn = document.getElementById('rail');
  // ODbL requires visible attribution while the station data is shown.
  const RAIL_ATTR = 'Station data <a href="https://github.com/davwheat/uk-railway-stations" target="_blank" rel="noopener">uk-railway-stations</a> (ODbL)';
  function setRail(on) {
    if (on === rail) return;
    rail = on; railBtn.classList.toggle('accent', on);
    if (on) { map.attributionControl.addAttribution(RAIL_ATTR); loadStations(); }
    else { map.attributionControl.removeAttribution(RAIL_ATTR); railLayer.clearLayers(); refreshUI(); }
  }
  railBtn.onclick = () => setRail(!rail);
  map.on('moveend', () => { if (rail) { clearTimeout(railTimer); railTimer = setTimeout(loadStations, 400); } });

  async function loadStations() {
    if (!rail) return;
    if (map.getZoom() < 10) { railLayer.clearLayers(); hintEl.textContent = 'Zoom in to see nearby stations'; return; }
    const c = map.getCenter();
    try {
      const res = await fetch('/api/stations?lat=' + c.lat + '&lng=' + c.lng);
      const stations = (await res.json()).stations || [];
      railLayer.clearLayers();
      if (!stations.length) { hintEl.textContent = 'No stations nearby'; return; }
      hintEl.textContent = 'Nearest stations — tap one for live departures';
      stations.forEach(addStation);
    } catch (_) { hintEl.textContent = 'Couldn’t load stations'; }
  }

  function addStation(st) {
    const m = L.marker([st.lat, st.lng], { icon: railIcon }).addTo(railLayer);
    m.bindPopup('<div class="stopname">' + esc(st.name) + ' <span class="sub">' + esc(st.crs) + '</span></div>' +
      '<div class="sub" id="dep-' + esc(st.crs) + '">…</div>', { minWidth: 230 });
    m.on('popupopen', async () => {
      const box = document.getElementById('dep-' + st.crs);
      if (!box) return;
      box.textContent = 'loading live departures…';
      try {
        const res = await fetch('/api/departures?crs=' + encodeURIComponent(st.crs));
        const board = await res.json();
        const deps = board.departures || [];
        box.innerHTML = deps.length
          ? deps.slice(0, 6).map(d => '<div class="arr"><b>' + esc(d.scheduled) + '</b> ' + esc(d.destination) +
              (d.platform ? ' · Plat ' + esc(d.platform) : '') +
              ' · <span class="' + (/^on time$/i.test(d.expected) ? 'ontime' : 'delayed') + '">' + esc(d.expected) + '</span></div>').join('')
          : 'no departures listed right now';
      } catch (_) { box.textContent = 'couldn’t load live departures'; }
    });
  }

  // --- live bus overlay (BODS: Great Britain, vehicle positions) ------------
  const busLayer = L.layerGroup().addTo(map);
  let buses = false, busTimer = null, busPoll = null;
  const busesBtn = document.getElementById('buses');
  const BUS_ATTR = 'Bus data <a href="https://www.bus-data.dft.gov.uk/" target="_blank" rel="noopener">BODS</a>';
  function busIcon(bearing) {
    return L.divIcon({ className: '', html: '<div class="bus" style="transform:rotate(' + (bearing || 0) + 'deg)"></div>', iconSize: [14, 14], iconAnchor: [7, 7] });
  }
  function setBuses(on) {
    if (on === buses) return;
    buses = on; busesBtn.classList.toggle('accent', on);
    if (on) {
      map.attributionControl.addAttribution(BUS_ATTR); loadBuses();
      busPoll = setInterval(loadBuses, 15000); // buses move — refresh their positions
    } else {
      map.attributionControl.removeAttribution(BUS_ATTR); clearInterval(busPoll); busLayer.clearLayers(); refreshUI();
    }
  }
  busesBtn.onclick = () => setBuses(!buses);
  map.on('moveend', () => { if (buses) { clearTimeout(busTimer); busTimer = setTimeout(loadBuses, 400); } });

  async function loadBuses() {
    if (!buses) return;
    if (map.getZoom() < 12) { busLayer.clearLayers(); hintEl.textContent = 'Zoom in to see live buses'; return; }
    const c = map.getCenter();
    try {
      const res = await fetch('/api/buses?lat=' + c.lat + '&lng=' + c.lng);
      const list = (await res.json()).buses || [];
      busLayer.clearLayers();
      if (!list.length) { hintEl.textContent = 'No live buses reporting here right now'; return; }
      hintEl.textContent = list.length + ' live buses nearby — tap one';
      list.forEach(b => {
        L.marker([b.lat, b.lng], { icon: busIcon(b.bearing) }).addTo(busLayer)
          .bindPopup('<div class="stopname">' + esc(b.line || 'Bus') + (b.destination ? ' → ' + esc(b.destination) : '') + '</div>' +
            (b.operator ? '<div class="sub">' + esc(b.operator) + '</div>' : ''), { minWidth: 180 });
      });
    } catch (_) { hintEl.textContent = 'Couldn’t load live buses'; }
  }

  // --- Ask Malten (spatial agent) -------------------------------------------
  let myLoc = null;
  const askBtn = document.getElementById('ask');
  const chat = document.getElementById('chat');
  const chatLog = document.getElementById('chatLog');
  const chatText = document.getElementById('chatText');
  let asking = false;

  let askAvail = false, railAvail = false, busesAvail = false;
  // Ask the server what it offers: shared tiles (no per-user key), the agent,
  // and the live feeds. Remember which live overlays exist so we can auto-start
  // them once we know where you are.
  fetch('/api/health').then(r => r.json()).then(d => {
    if (d.tiles) { serverTiles = true; setTiles(); }
    if (d.ask) { askAvail = true; askBtn.hidden = false; }
    if (d.rail) { railAvail = true; document.getElementById('rail').hidden = false; }
    if (d.buses) { busesAvail = true; document.getElementById('buses').hidden = false; }
    if (d.search) document.getElementById('searchbox').hidden = false;
    if (!serverTiles && !Malten.getKey()) askForKey();
    if (myLoc) goLive(myLoc); // location already known before health returned
  }).catch(() => { if (!Malten.getKey()) askForKey(); });

  // focus=true opens the keyboard for typing; the "Around you" card opens the
  // chat WITHOUT focus, so a canned question doesn't pop the keyboard (which on
  // iOS scrolls the whole layout and strands the reply off-screen).
  function openChat(focus) {
    chat.hidden = false;
    document.body.classList.add('chatting');
    window.scrollTo(0, 0);
    if (!chatLog.childElementCount) addMsg('malten', 'Ask me what’s nearby, how to get somewhere, or what’s worth doing around here right now.');
    chatLog.scrollTop = chatLog.scrollHeight;
    if (focus) chatText.focus();
  }
  function closeChat() { chat.hidden = true; document.body.classList.remove('chatting'); chatText.blur(); }
  askBtn.onclick = () => { if (chat.hidden) openChat(true); else closeChat(); };
  document.getElementById('chatClose').onclick = closeChat;

  function addMsg(who, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    el.textContent = text;
    chatLog.appendChild(el);
    chatLog.scrollTop = chatLog.scrollHeight;
    return el;
  }

  function toolPhrase(t) {
    return t === 'around_me' ? 'Looking around you…'
      : t === 'find_place' ? 'Searching the map…'
      : t === 'whats_here' ? 'Working out where that is…'
      : t === 'nearby_stations' ? 'Finding nearby stations…'
      : t === 'train_departures' ? 'Checking live departures…'
      : t === 'live_buses' ? 'Finding buses nearby…'
      : t === 'nearby_stops' ? 'Finding nearby stops…'
      : t === 'arrivals' ? 'Checking live arrivals…'
      : t === 'grid_ref' ? 'Locating on the grid…' : 'Working…';
  }

  document.getElementById('chatForm').onsubmit = (e) => { e.preventDefault(); runAsk(chatText.value.trim()); };

  async function runAsk(q) {
    if (!q || asking) return;
    chatText.value = '';
    addMsg('me', q);
    asking = true;
    const bubble = addMsg('malten', '…');
    bubble.classList.add('streaming', 'toolonly');
    let answer = '';
    const pin = () => { chatLog.scrollTop = chatLog.scrollHeight; };
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 90000); // never lock the chat on a hung stream
    try {
      const res = await fetch('/api/ask', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctrl.signal,
        body: JSON.stringify({ message: q, lat: myLoc ? myLoc.lat : 0, lng: myLoc ? myLoc.lng : 0, has_loc: !!myLoc }),
      });
      if (!res.ok || !res.body) {
        let msg = 'Sorry — I couldn’t answer just then.';
        try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (_) {}
        throw new Error(msg);
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        buf = buf.replace(/\r/g, ''); // tolerate CRLF from proxies
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const line = buf.slice(0, idx).replace(/^data:\s?/, '');
          buf = buf.slice(idx + 2);
          if (line === '' || line[0] === ':' || line === '[DONE]') continue; // skip blanks, comments, sentinel
          let ev; try { ev = JSON.parse(line); } catch (_) { continue; }
          if (ev.Type === 'text') {
            if (bubble.classList.contains('toolonly')) { bubble.classList.remove('toolonly'); answer = ''; }
            answer += ev.Text;
            bubble.innerHTML = mdToHtml(answer);
            pin();
          } else if (ev.Type === 'tool') {
            if (bubble.classList.contains('toolonly')) { bubble.textContent = toolPhrase(ev.Tool); pin(); }
          } else if (ev.Type === 'error') {
            bubble.classList.remove('toolonly');
            answer = (answer ? answer + '\n' : '') + ev.Text;
            bubble.textContent = answer;
            pin();
          }
        }
      }
    } catch (e) {
      const msg = (e && e.message && e.name !== 'AbortError') ? e.message : 'Sorry — I couldn’t answer just then.';
      if (bubble.classList.contains('toolonly')) { bubble.classList.remove('toolonly'); bubble.textContent = ''; }
      if (!bubble.textContent) bubble.textContent = msg;
    } finally {
      clearTimeout(timeout);
      bubble.classList.remove('streaming');
      if (!bubble.textContent) bubble.textContent = '…';
      asking = false;
    }
  }

  // Open the agent and ask a question in one go (used by the "Around you" card).
  // No focus → no keyboard: the reply streams in view instead of being pushed up.
  function askAbout(q) { openChat(false); runAsk(q); }

  // --- go live: on the first fix, start the moving overlays and greet you with
  // a live snapshot of what's around you right now. --------------------------
  const aroundEl = document.getElementById('around');
  let wentLive = false, aroundTimer = null;

  function goLive(latlng) {
    if (railAvail) setRail(true);
    if (busesAvail) setBuses(true);
    if (!wentLive) { wentLive = true; showAround(latlng); }
  }

  function closeAround() { aroundEl.hidden = true; hintEl.style.display = ''; clearTimeout(aroundTimer); }

  async function showAround(latlng) {
    try {
      const res = await fetch('/api/around?lat=' + latlng.lat + '&lng=' + latlng.lng);
      const a = await res.json();
      if (!a.in_gb) return;
      const bits = [];
      if (a.buses_nearby) bits.push('🚍 ' + a.buses_nearby + ' bus' + (a.buses_nearby === 1 ? '' : 'es') + ' moving');
      const st = (a.stations || [])[0];
      if (st) {
        let s = '🚆 ' + esc(st.name);
        const nx = (st.next || [])[0];
        if (nx) s += ' · ' + esc(nx.scheduled) + ' → ' + esc(nx.destination) + (/^on time$/i.test(nx.expected) ? '' : ' (' + esc(nx.expected) + ')');
        else s += ' · ' + st.miles + ' mi';
        bits.push(s);
      }
      if (a.stops_nearby) bits.push('🚇 ' + a.stops_nearby + ' stop' + (a.stops_nearby === 1 ? '' : 's'));
      const where = a.place
        ? 'You’re near <b>' + esc(a.place.name) + '</b>' + (a.place.type ? ' <span class="sub">' + esc(a.place.type) + '</span>' : '')
        : (a.grid_ref ? 'You’re at <b>' + esc(a.grid_ref) + '</b>' : 'You’re here');
      aroundEl.innerHTML =
        '<button class="around-x" title="Dismiss">✕</button>' +
        '<div class="around-where">' + where + '</div>' +
        (bits.length ? '<div class="around-stats">' + bits.join('<span class="dot">·</span>') + '</div>' : '') +
        (askAvail ? '<div class="around-actions"><button class="primary" id="around-ask">What’s good nearby?</button></div>' : '');
      aroundEl.hidden = false;
      hintEl.style.display = 'none';
      aroundEl.querySelector('.around-x').onclick = closeAround;
      const ab = aroundEl.querySelector('#around-ask');
      if (ab) ab.onclick = () => { closeAround(); askAbout('What’s interesting to do near me right now? Give me a couple of concrete options and how to get to each.'); };
      clearTimeout(aroundTimer); aroundTimer = setTimeout(closeAround, 30000);
    } catch (_) {}
  }

  // Track the on-screen keyboard so the chat can sit above it (--kb). Without
  // this the input hides behind the keyboard on phones.
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const onVV = () => {
      const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb', kb + 'px');
      if (!chat.hidden) chatLog.scrollTop = chatLog.scrollHeight;
    };
    vv.addEventListener('resize', onVV);
    vv.addEventListener('scroll', onVV);
    onVV();
  }

  // --- wire it up ------------------------------------------------------------
  document.getElementById('settings').onclick = askForKey;
  map.on('click', e => { if (!sheet || !sheet.classList.contains('logsheet')) openLog(e.latlng); });

  Malten.getFinds().forEach(addFindMarker);
  updateCount();
  setTiles(); // client-key path until /api/health confirms server-side tiles

  // Auto-locate on load so the map opens where you are (and the agent knows
  // your location). The locationfound handler only recentres inside GB.
  setTimeout(() => { hintEl.textContent = 'Finding your location…'; map.locate({ enableHighAccuracy: true, timeout: 10000 }); }, 400);
</script>
