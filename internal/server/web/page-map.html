{{define "content"}}
<main class="page">
  <header class="topbar"><a class="brand" href="/">Malten</a><span class="current-stream" id="current-stream"></span></header>

  <form class="composer" id="composer">
    <div class="capture-preview" id="capture-preview" hidden><img id="photo-preview" alt="Photo ready to capture"><button id="photo-clear" type="button" aria-label="Remove photo">×</button></div>
    <div class="capture-row">
      <div class="capture-tools">
        <button class="capture-tool" id="camera" type="button" aria-label="Take a photo" title="Take a photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h3l1.4-2h7.2l1.4 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <button class="capture-tool" id="voice" type="button" aria-label="Capture with voice" title="Capture with voice"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v4M9 21h6"/></svg></button>
      </div>
      <textarea id="thought" rows="1" maxlength="1200" placeholder="What's on your mind?" aria-label="What's on your mind?"></textarea>
      <button class="capture-submit" type="submit" aria-label="Capture">↑</button>
    </div>
    <input id="photo-input" type="file" accept="image/*" capture="environment" hidden>
  </form>

  <section class="stream" id="stream" aria-label="Your observations and reflections"></section>

</main>
{{end}}

{{define "scripts"}}
<script>
(function () {
  const form=document.getElementById('composer'), input=document.getElementById('thought');
  const stream=document.getElementById('stream');
  const photoInput=document.getElementById('photo-input'), photoPreview=document.getElementById('photo-preview');
  const capturePreview=document.getElementById('capture-preview');
  let network=Malten.getNetwork(), currentLocation=null, photo=null;

  const when=t=>new Intl.DateTimeFormat(undefined,{day:'numeric',month:'short',year:new Date(t).getFullYear()===new Date().getFullYear()?undefined:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(t));
  function metres(a,b){if(!a||!b)return Infinity;const r=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lng-a.lng)*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*r*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

  function render(){
    stream.replaceChildren();
    const active=decodeURIComponent(window.location.hash.slice(1)).toLowerCase();
    document.getElementById('current-stream').textContent=active?'#'+active:'';
    [...network.points].filter(point=>!active||tags(point.text).includes(active)).sort((a,b)=>b.created_at-a.created_at).forEach(point=>{
      const entry=document.createElement('article');entry.className='reflection';
      const text=document.createElement('div');text.className='reflection-text';appendText(text,point.text);
      entry.appendChild(text);
      if(point.photo){const image=document.createElement('img');image.className='reflection-photo';image.src=point.photo;image.alt='';entry.appendChild(image);}
      const event=document.createElement('div');event.className='reflection-event';
      event.textContent=[when(point.created_at),point.location&&point.location.name].filter(Boolean).join(' · ');
      entry.appendChild(event);
      stream.appendChild(entry);
    });
  }
  function tags(text){return [...text.matchAll(/(^|\s)#([\p{L}\p{N}_-]+)/gu)].map(match=>match[2].toLowerCase());}
  function appendText(element,text){let at=0;for(const match of text.matchAll(/(^|\s)#([\p{L}\p{N}_-]+)/gu)){const start=match.index+match[1].length;element.append(document.createTextNode(text.slice(at,start)));const link=document.createElement('a');link.className='stream-link';link.href='/#'+encodeURIComponent(match[2].toLowerCase());link.textContent='#'+match[2];element.append(link);at=start+match[2].length+1;}element.append(document.createTextNode(text.slice(at)));}

  function addThought(text){
    const point={id:Malten.newId(),text,photo,created_at:Date.now(),location:currentLocation?{lat:currentLocation.lat,lng:currentLocation.lng,accuracy:currentLocation.accuracy,name:currentLocation.name||null}:null};
    if(point.location){const nearby=[...network.points].reverse().find(p=>p.location&&metres(point.location,p.location)<180);if(nearby)network.connections.push({id:Malten.newId(),from:nearby.id,to:point.id,kind:'place'});}
    network.points.push(point);Malten.setNetwork(network);clearPhoto();render();
  }

  form.onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text&&!photo)return;input.value='';input.style.height='';addThought(text||'Photo');};
  input.oninput=()=>{input.style.height='';input.style.height=Math.min(input.scrollHeight,130)+'px';};
  input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}};
  document.getElementById('camera').onclick=()=>photoInput.click();
  document.getElementById('photo-clear').onclick=clearPhoto;
  function clearPhoto(){photo=null;photoInput.value='';photoPreview.removeAttribute('src');capturePreview.hidden=true;}
  function preparePhoto(file){if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const max=1280,scale=Math.min(1,max/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);photo=canvas.toDataURL('image/jpeg',.78);photoPreview.src=photo;capturePreview.hidden=false;};image.src=reader.result;};reader.readAsDataURL(file);}
  photoInput.onchange=()=>preparePhoto(photoInput.files&&photoInput.files[0]);

  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition,voiceButton=document.getElementById('voice');
  if(SpeechRecognition){const recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=true;recognition.lang=navigator.language||'en';let before='';
    recognition.onstart=()=>{before=input.value.trim();voiceButton.classList.add('recording');voiceButton.setAttribute('aria-label','Listening');};
    recognition.onresult=e=>{let spoken='';for(let i=e.resultIndex;i<e.results.length;i++)spoken+=e.results[i][0].transcript;input.value=(before+(before&&spoken?' ':'')+spoken).trim();input.dispatchEvent(new Event('input'));};
    recognition.onend=()=>{voiceButton.classList.remove('recording');voiceButton.setAttribute('aria-label','Capture with voice');input.focus();};
    recognition.onerror=recognition.onend;voiceButton.onclick=()=>recognition.start();
  }else{voiceButton.disabled=true;voiceButton.title='Voice transcription is not supported by this browser';}

  let locationKey='';
  async function nameLocation(){const key=currentLocation.lat.toFixed(4)+','+currentLocation.lng.toFixed(4);if(key===locationKey)return;locationKey=key;try{const response=await fetch('/api/location?lat='+encodeURIComponent(currentLocation.lat)+'&lng='+encodeURIComponent(currentLocation.lng));if(!response.ok)return;const place=await response.json();currentLocation.name=[place.name,place.locality].filter((v,i,a)=>v&&a.indexOf(v)===i).join(', ');}catch(_){}}
  if(navigator.geolocation)navigator.geolocation.watchPosition(pos=>{currentLocation={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,name:null};nameLocation();},()=>{},{enableHighAccuracy:false,maximumAge:120000,timeout:12000});
  window.addEventListener('hashchange',render);render();
})();
</script>
{{end}}
