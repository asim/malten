{{define "head"}}
<style>
  .pagehead { display: flex; align-items: center; gap: 12px; margin: 4px 0 8px; }
  .pagehead h1 { font-size: 20px; margin: 0; }
  .pagehead .spacer { flex: 1; }
  .refresh { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
             padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .refresh:hover { border-color: var(--accent); }
  .summary { color: var(--muted); font-size: 13px; margin: 8px 0 12px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:hover td { background: var(--panel); }
  td.summary-cell { max-width: 380px; }
  .kind-escalation { color: var(--warn); border-color: var(--warn); }
  .kind-ticket { color: var(--accent); border-color: var(--accent); }
  .prio-urgent, .prio-high { color: var(--err); border-color: var(--err); }
  .prio-normal, .prio-low { color: var(--muted); }
  .status-open { color: var(--ok); border-color: var(--ok); }
  .status-closed { color: var(--muted); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .error { color: var(--err); padding: 20px 0; }

  /* On phones, stack each row into a labelled card instead of a wide table. */
  @media (max-width: 640px) {
    .tablewrap { overflow-x: visible; }
    table, tbody, tr, td { display: block; }
    thead { position: absolute; left: -9999px; }
    tr { border: 1px solid var(--border); border-radius: 10px; margin: 12px 0; padding: 4px 2px; background: var(--panel); }
    tr:hover td { background: transparent; }
    td { border: none; padding: 7px 12px; display: flex; gap: 10px; align-items: baseline; }
    td::before { content: attr(data-label); color: var(--muted); font-size: 12px; text-transform: uppercase;
                 letter-spacing: 0.03em; flex: 0 0 84px; }
    td.summary-cell { max-width: none; }
  }
</style>
{{end}}

{{define "content"}}
<div class="wrap">
  <div class="pagehead">
    <h1>Tickets</h1>
    <span class="spacer"></span>
    <button class="refresh" id="refresh">Refresh</button>
  </div>
  <div class="summary" id="summary"></div>
  <div id="content"></div>
</div>
{{end}}

{{define "scripts"}}
<script>
  const content = document.getElementById('content');
  const summaryEl = document.getElementById('summary');

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function when(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return esc(iso);
    return d.toLocaleString();
  }

  function render(tickets) {
    if (!tickets || tickets.length === 0) {
      summaryEl.textContent = '';
      content.innerHTML = '<div class="empty">No tickets or escalations yet. They appear here when the agent files a ticket or hands off to a human.</div>';
      return;
    }
    const esc_count = tickets.filter(t => t.kind === 'escalation').length;
    const open = tickets.filter(t => t.status === 'open').length;
    summaryEl.textContent = `${tickets.length} item${tickets.length===1?'':'s'} · ${open} open · ${esc_count} escalation${esc_count===1?'':'s'}`;

    const rows = tickets.map(t => `
      <tr>
        <td class="mono" data-label="ID">${esc(t.id)}</td>
        <td data-label="Kind"><span class="badge kind-${esc(t.kind)}">${esc(t.kind)}</span></td>
        <td class="summary-cell" data-label="Summary">${esc(t.summary)}</td>
        <td data-label="Priority"><span class="badge prio-${esc(t.priority)}">${esc(t.priority)}</span></td>
        <td data-label="Status"><span class="badge status-${esc(t.status)}">${esc(t.status)}</span></td>
        <td class="mono" data-label="Customer">${esc(t.customer_id) || '—'}</td>
        <td class="mono" data-label="Session">${esc(t.session_id) || '—'}</td>
        <td class="mono" data-label="Created">${when(t.created_at)}</td>
      </tr>`).join('');

    content.innerHTML = `
      <div class="tablewrap"><table>
        <thead>
          <tr><th>ID</th><th>Kind</th><th>Summary</th><th>Priority</th><th>Status</th><th>Customer</th><th>Session</th><th>Created</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }

  async function load() {
    content.innerHTML = '<div class="summary">Loading…</div>';
    try {
      const res = await fetch('/api/tickets');
      const data = await res.json();
      if (data.error) { content.innerHTML = `<div class="error">Error: ${esc(data.error)}</div>`; return; }
      render(data.tickets || []);
    } catch (err) {
      content.innerHTML = `<div class="error">Failed to load: ${esc(err.message)}</div>`;
    }
  }

  document.getElementById('refresh').addEventListener('click', load);
  load();
</script>
{{end}}
