{{define "head"}}
<style>
  .controls { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls label { font-size: 13px; color: var(--muted); }
  /* 16px inputs stop iOS Safari from auto-zooming when the field gains focus. */
  .controls input { background: var(--panel2); border: 1px solid var(--border); color: var(--text);
                    border-radius: 8px; padding: 6px 10px; font-size: 16px; width: 140px; }
  .controls .hint { font-size: 12px; color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; flex-direction: column; max-width: 88%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .user .bubble { background: var(--user); }
  .agent .bubble { background: var(--agent); border: 1px solid var(--border); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 5px; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge.esc { color: var(--warn); border-color: var(--warn); }
  .badge.allow { color: var(--ok); border-color: var(--ok); }
  .badge.deny, .badge.err { color: var(--err); border-color: var(--err); }
  .actions { margin-top: 6px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--border);
             border-radius: 10px; padding: 8px 10px; width: 100%; }
  .actions code { color: var(--text); }
  form { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border);
         padding-bottom: calc(14px + env(safe-area-inset-bottom)); }  /* clear the iOS home bar */
  #input { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
           border-radius: 10px; padding: 12px 14px; font-size: 16px; resize: none; font-family: inherit; }
  form button { background: var(--accent); color: white; border: 0; border-radius: 10px; padding: 0 18px; font-size: 15px;
                cursor: pointer; font-weight: 600; flex-shrink: 0; }
  form button:disabled { opacity: 0.5; cursor: default; }
  .typing { color: var(--muted); font-size: 13px; font-style: italic; }
  @media (max-width: 560px) {
    .controls, #log, form { padding-left: 14px; padding-right: 14px; }
    .msg { max-width: 92%; }
  }
</style>
{{end}}

{{define "content"}}
<main class="chat">
  <div class="controls">
    <label for="cust">Customer ID</label>
    <input id="cust" placeholder="CUST-1001" autocomplete="off">
    <span class="hint">try CUST-1001 (Ada) or CUST-1002 (Alan)</span>
  </div>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask about billing, refunds, login, or anything else…"></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</main>
{{end}}

{{define "scripts"}}
<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const cust = document.getElementById('cust');
  const sendBtn = document.getElementById('send');
  let sessionId = localStorage.getItem('malten_session') || '';
  cust.value = localStorage.getItem('malten_customer') || '';

  // Debug view exposes the internal tool calls and policy decisions. It is OFF
  // for customers. Turn it on with ?debug=1 (persists), off with ?debug=0.
  const dbgParam = new URLSearchParams(location.search).get('debug');
  if (dbgParam === '1') localStorage.setItem('malten_debug', '1');
  if (dbgParam === '0') localStorage.removeItem('malten_debug');
  const DEBUG = localStorage.getItem('malten_debug') === '1';

  // Track the visible viewport so the on-screen keyboard shrinks the (flexible)
  // message log rather than pushing the header and input around.
  const vv = window.visualViewport;
  function fitViewport() {
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-h', h + 'px');
    log.scrollTop = log.scrollHeight;
  }
  if (vv) {
    vv.addEventListener('resize', fitViewport);
    vv.addEventListener('scroll', fitViewport);
  }
  window.addEventListener('orientationchange', () => setTimeout(fitViewport, 200));
  fitViewport();

  function el(cls, html) { const d = document.createElement('div'); d.className = cls; if (html !== undefined) d.innerHTML = html; return d; }
  function esc(s) { return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  function addMessage(role, text, reply) {
    const wrap = el('msg ' + role);
    wrap.appendChild(el('bubble', esc(text)));
    if (reply && reply.escalated && !DEBUG) {
      // Customer-facing: a gentle note only — no steps, no tool internals.
      const meta = el('meta');
      meta.innerHTML = `<span class="badge esc">a human will follow up</span>`;
      wrap.appendChild(meta);
    }
    if (reply && DEBUG) {
      // Debug-only: the full trace of steps, tool calls and decisions.
      const meta = el('meta');
      meta.innerHTML = `<span>${reply.steps} step${reply.steps===1?'':'s'}</span>`;
      if (reply.escalated) meta.innerHTML += ` <span class="badge esc">escalated</span>`;
      wrap.appendChild(meta);
      if (reply.actions && reply.actions.length) {
        const a = el('actions');
        a.innerHTML = reply.actions.map(ac => {
          const cls = ac.decision === 'allow' ? 'allow' : (ac.decision === 'escalate' ? 'esc' : 'deny');
          const r = ac.reason ? ` — ${esc(ac.reason)}` : (ac.result ? ` — ${esc(ac.result)}` : '');
          return `<div><code>${esc(ac.tool)}</code> <span class="badge ${cls}">${ac.decision}</span>${r}</div>`;
        }).join('');
        wrap.appendChild(a);
      }
    }
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }

  // Concatenate the visible text of a stored message (skips tool_use/tool_result).
  function textOf(content) {
    return (content || []).filter(b => b.type === 'text' && b.text && b.text.trim()).map(b => b.text).join('');
  }

  // On load, rebuild the conversation from the server so a refresh keeps history.
  async function loadHistory() {
    if (!sessionId) return;
    try {
      const res = await fetch('/api/session/' + encodeURIComponent(sessionId));
      const data = await res.json();
      for (const m of (data.messages || [])) {
        const t = textOf(m.content);
        if (t) addMessage(m.role === 'user' ? 'user' : 'agent', t);
      }
    } catch (err) { /* if history can't load, just start fresh */ }
  }

  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  // Re-fit once the keyboard has finished animating in.
  input.addEventListener('focus', () => setTimeout(fitViewport, 250));

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    localStorage.setItem('malten_customer', cust.value.trim());
    addMessage('user', text);
    input.value = ''; input.style.height = 'auto';
    sendBtn.disabled = true;
    const typing = el('msg agent'); typing.appendChild(el('typing', 'Malten is thinking…')); log.appendChild(typing); log.scrollTop = log.scrollHeight;
    try {
      const res = await fetch('/api/chat', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ session_id: sessionId, customer_id: cust.value.trim(), message: text })
      });
      const data = await res.json();
      typing.remove();
      if (data.error) { addMessage('agent', data.error); }
      else {
        sessionId = data.session_id; localStorage.setItem('malten_session', sessionId);
        addMessage('agent', data.text, data);
      }
    } catch (err) {
      typing.remove();
      addMessage('agent', 'Network error: ' + err.message);
    } finally {
      sendBtn.disabled = false; input.focus();
    }
  });

  loadHistory();
  input.focus();
</script>
{{end}}
